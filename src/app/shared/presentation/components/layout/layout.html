<div class="layout">
  <header class="topbar">
    <button
      type="button"
      class="menu-toggle"
      aria-controls="app-sidebar"
      [attr.aria-expanded]="sidebarOpen()"
      [attr.aria-label]="sidebarOpen() ? 'Cerrar menú' : 'Abrir menú'"
      (click)="toggleSidebar()"
    >
      <mat-icon aria-hidden="true">{{ sidebarOpen() ? 'close' : 'menu' }}</mat-icon>
    </button>
    <span class="topbar-title">StockIA</span>
  </header>

  @if (sidebarOpen()) {
    <div class="backdrop" (click)="closeSidebar()"></div>
  }

  <aside id="app-sidebar" class="sidebar" [class.open]="sidebarOpen()">
    <a class="logo" routerLink="/home" (click)="closeSidebar()">
      <span class="logo-mark">S</span>
      <span class="logo-text">StockIA</span>
    </a>

    <nav class="nav" aria-label="Navegación principal">
      @for (option of options; track option.link) {
        <a
          class="nav-item"
          [routerLink]="option.link"
          routerLinkActive="active"
          (click)="closeSidebar()"
        >
          <mat-icon aria-hidden="true">{{ option.icon }}</mat-icon>
          <span>{{ option.label }}</span>
        </a>
      }
    </nav>
  </aside>

  <main class="content">
    <router-outlet />
  </main>
</div>
